<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BoxMonitor</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
<main>
  <h1>BoxMonitor</h1>
  <div class="controls">
    <button data-key="previous" aria-label="Previous target" disabled>&lt;</button>
    <button data-key="next" aria-label="Next target" disabled>&gt;</button>
    <form id="add-host"><input id="host" aria-label="Add a named host" aria-describedby="input-help" placeholder="Name = example.com or https://example.com" maxlength="2000" autocomplete="off" spellcheck="false" disabled></form>
  </div>
  <p id="input-help">Enter to add · ← → or h / l to switch · p to change plot</p>
  <p id="status" role="status">Loading…</p>
  <div class="screen-scroll" role="region" aria-label="Scrollable monitor" tabindex="0"><pre id="terminal" tabindex="0" aria-label="BoxMonitor terminal">Loading WebAssembly…</pre></div>
  <p class="note">Browser demo · simulated data, including added hosts. No real network checks.</p>
</main>
</body>
</html>
