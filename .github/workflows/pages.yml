name: Browser demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: boxmonitor-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Install Wasm bindings generator
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.104'; then
            cargo install wasm-bindgen-cli --version 0.2.104 --locked --force
          fi
      - name: Native checks
        run: |
          cargo test --locked
          cargo check --locked --bin boxmonitor
      - name: Build static demo
        run: scripts/build-web.sh
      - name: Browser checks
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: web/test-results
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
